name: Publicar beta no GitHub Pages

on:
  pull_request:
    branches:
      - main
    paths:
      - "01_DESENVOLVIMENTO/**"
      - "scripts/build-beta.mjs"
      - ".github/workflows/deploy-pages.yml"
  push:
    branches:
      - main
    paths:
      - "01_DESENVOLVIMENTO/**"
      - "scripts/build-beta.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: 01_DESENVOLVIMENTO/pnpm-lock.yaml
      - name: Instalar dependências
        working-directory: 01_DESENVOLVIMENTO
        run: pnpm install --frozen-lockfile
      - name: Instalar Chromium e dependências do sistema
        working-directory: 01_DESENVOLVIMENTO
        run: pnpm exec playwright install --with-deps chromium
      - name: Executar testes automatizados
        working-directory: 01_DESENVOLVIMENTO
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: 01_DESENVOLVIMENTO/pnpm-lock.yaml
      - name: Instalar dependências do build
        working-directory: 01_DESENVOLVIMENTO
        run: pnpm install --frozen-lockfile
      - name: Montar os arquivos do beta
        working-directory: 01_DESENVOLVIMENTO
        run: pnpm build
      - name: Enviar os arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-beta

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

